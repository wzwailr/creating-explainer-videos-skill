name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm test
      - run: npm run examples:verify
      - name: Validate Skill contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python skill/creating-explainer-videos/scripts/test_skill.py
      - name: Validate extensions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python skill/creating-explainer-videos/scripts/test_extensions.py
      - run: npm run build

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run pack:local
      - run: npm run pack:zip
      - run: npm run audit:packed -- .\dist\creating-explainer-videos-skill-2.0.0.tgz
      - run: npm run smoke:packed -- .\dist\creating-explainer-videos-skill-2.0.0.tgz
