<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "钉钉进步体"; src: local("钉钉进步体"); font-weight: 400; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }
    body { color: #201e1b; background: #f8f3e8; }
    .cover { position: relative; width: 100%; height: 100%; padding: 5% 4%; background: repeating-linear-gradient(0deg, transparent 0 70px, rgba(38,74,199,.07) 71px 73px), #f8f3e8; }
    .series-cluster { display: flex; align-items: center; gap: 16px; }
    .series, .episode { padding: 14px 20px; border: 4px solid #201e1b; box-shadow: 7px 7px 0 #f0c331; }
    .series { color: #fff; background: #201e1b; font: 400 28px/1 "钉钉进步体", sans-serif; }
    .episode { background: #fffaf0; font: 750 24px/1 "Noto Sans SC", sans-serif; }
    h1 { max-width: 58%; margin: 9% 0 2%; font: 400 clamp(72px, 7vw, 132px)/.95 "钉钉进步体", sans-serif; }
    .hook { max-width: 58%; padding: 18px 22px; border-left: 10px solid #dc3f36; font: 750 38px/1.3 "Noto Sans SC", sans-serif; }
    .mechanism-art { position: absolute; right: 4%; top: 20%; width: 34%; height: 66%; display: grid; place-items: center; border: 6px solid #201e1b; background: #fffaf0; box-shadow: 16px 16px 0 #264ac7; padding: 8%; text-align: center; font: 400 38px/1.2 "钉钉进步体", sans-serif; }
  </style>
</head>
<body>
  <main class="cover" data-cover-title="{{TOPIC}}">
    <div class="series-cluster">
      <div class="series">{{SERIES}}</div>
      <div class="episode">第 {{SEASON}} 季 · 第 {{EPISODE}} 集</div>
    </div>
    <h1>{{TOPIC}}</h1>
    <div class="hook">{{QUESTION}}</div>
    <div class="mechanism-art">待按本集机制重画</div>
  </main>
</body>
</html>
